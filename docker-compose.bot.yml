version: '3.8'

services:
  # Только Telegram бот (использует существующую сеть и БД)
  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    container_name: kiruhak_bot
    restart: unless-stopped
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      ADMIN_TELEGRAM_ID: ${ADMIN_TELEGRAM_ID:-739618149}
      API_URL: ${BOT_API_URL:-http://127.0.0.1:3000/api/auth/create-account}
      BOT_API_BASE_URL: ${BOT_API_BASE_URL:-http://127.0.0.1:3000}
      BOT_SECRET: ${BOT_SECRET}
      NOTIFY_NEW_REGISTRATIONS: ${NOTIFY_NEW_REGISTRATIONS:-true}
    network_mode: host
    # Используем host network для доступа к localhost:3000

